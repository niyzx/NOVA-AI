<!DOCTYPE html>
<!--
  NOVA – Assistente Virtual
  ARQUIVO 1 de 3: index.html  (a estrutura da tela)
  Este arquivo só descreve o que existe na tela.
  O visual está em style.css e o comportamento em script.js.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover usa a tela toda (inclusive áreas com "notch").
       interactive-widget=resizes-content faz a tela encolher quando o teclado abre. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- Cor da barra do navegador/Android -->
  <meta name="theme-color" content="#0b0f1a">
  <title>NOVA – Assistente Virtual</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Contêiner principal do app ===== -->
  <div class="app" id="app">

    <!-- ===== Barra superior: avatar, nome e botões ===== -->
    <header class="topbar">
      <div class="avatar" id="avatar" aria-hidden="true">
        <span class="avatar-core"></span>
      </div>

      <div class="title">
        <h1>NOVA</h1>
        <p id="status">Online</p>
      </div>

      <div class="actions">
        <!-- Liga/desliga a voz do assistente -->
        <button class="icon-btn" id="btnVoice" type="button" aria-label="Ativar ou desativar a voz da NOVA" title="Voz da NOVA">
          <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
        </button>

        <!-- Limpa a conversa -->
        <button class="icon-btn" id="btnClear" type="button" aria-label="Limpar conversa" title="Limpar conversa">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
        </button>

        <!-- Abre as configurações -->
        <button class="icon-btn" id="btnSettings" type="button" aria-label="Configurações" title="Configurações">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- ===== Área onde as mensagens aparecem ===== -->
    <main class="chat" id="chat" aria-live="polite"></main>

    <!-- ===== Animação "pensando..." (escondida até ser usada) ===== -->
    <div class="typing" id="typing" hidden>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <em>NOVA está pensando…</em>
    </div>

    <!-- ===== Atalhos rápidos (cada botão envia o texto dele) ===== -->
    <div class="chips" id="chips">
      <button type="button" class="chip" data-text="Que horas são?">🕒 Horas</button>
      <button type="button" class="chip" data-text="Qual é a data?">📅 Data</button>
      <button type="button" class="chip" data-text="Me ajude">💡 Ajuda</button>
      <button type="button" class="chip" data-text="Conte uma piada">😄 Piada</button>
    </div>

    <!-- ===== Campo de digitar + microfone + enviar ===== -->
    <form class="composer" id="composer" autocomplete="off">
      <button class="mic" id="btnMic" type="button" aria-label="Falar com a NOVA" title="Falar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
      </button>

      <textarea id="input" rows="1" maxlength="1000" placeholder="Digite sua mensagem…" aria-label="Mensagem"></textarea>

      <button class="send" id="btnSend" type="submit" aria-label="Enviar mensagem" title="Enviar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
      </button>
    </form>
  </div>

  <!-- ===== Janela de configurações ===== -->
  <div class="modal" id="settings" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Configurações</h2>

      <label class="field">
        <span>Seu nome</span>
        <input id="setName" type="text" maxlength="30" placeholder="Como devo te chamar?">
      </label>

      <label class="field row">
        <span>Respostas por voz</span>
        <input id="setVoice" type="checkbox" class="switch">
      </label>

      <label class="field">
        <span>Velocidade da voz: <b id="rateLabel">1.0x</b></span>
        <input id="setRate" type="range" min="0.7" max="1.5" step="0.1" value="1">
      </label>

      <div class="modal-actions">
        <button type="button" class="btn danger" id="btnWipe">Apagar tudo</button>
        <button type="button" class="btn primary" id="btnCloseSettings">Pronto</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
